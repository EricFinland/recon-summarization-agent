<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Recon Summarization Agent</title>
  <desc id="desc">Banner with an animated radar sweep over a grid, next to the project name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.55" stop-color="#0a1a2f"/>
      <stop offset="1" stop-color="#062a24"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2ee6a6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafff6"/>
      <stop offset="1" stop-color="#7cf5cb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2ee6a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2ee6a6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="scope">
      <circle cx="975" cy="150" r="112"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Left: title block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#2ee6a6" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="16" letter-spacing="3">AGENT 1 OF 4 · AI-ASSISTED PENTEST POC</text>
    <text x="70" y="152" fill="url(#titleGrad)" font-size="50" font-weight="700">Recon Summarization</text>
    <text x="70" y="206" fill="url(#titleGrad)" font-size="50" font-weight="700">Agent</text>
    <text x="72" y="246" fill="#9fb8c9" font-size="18">Grounded, injection-resistant scan summaries for the classification agent.</text>
    <g transform="translate(232 178)">
      <rect x="0" y="0" width="300" height="34" rx="17" fill="#2ee6a6" fill-opacity="0.08" stroke="#2ee6a6" stroke-opacity="0.45"/>
      <circle cx="20" cy="17" r="5" fill="#2ee6a6">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="23" fill="#c9f7e6" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15">every fact traces to the scan</text>
    </g>
  </g>

  <!-- Right: radar scope -->
  <circle cx="975" cy="150" r="140" fill="url(#glow)"/>
  <g fill="none" stroke="#2ee6a6">
    <circle cx="975" cy="150" r="112" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="975" cy="150" r="75" stroke-opacity="0.25"/>
    <circle cx="975" cy="150" r="38" stroke-opacity="0.25"/>
    <path d="M863 150H1087M975 38V262" stroke-opacity="0.18"/>
  </g>
  <g clip-path="url(#scope)">
    <g>
      <path d="M975 150L1087 150A112 112 0 0 0 1060.8 78Z" fill="url(#sweep)"/>
      <path d="M975 150L1087 150" stroke="#7cf5cb" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0 975 150" to="360 975 150" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Blips: hosts found by the scan -->
  <g fill="#7cf5cb">
    <circle cx="1030" cy="112" r="4.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.08;0.6;1" dur="4s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="96" r="4.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.08;0.6;1" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="912" cy="188" r="4.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.08;0.6;1" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1018" cy="205" r="4.5" opacity="0">
      <animate attributeName="opacity" values="0;1;0.15;0" keyTimes="0;0.08;0.6;1" dur="4s" begin="3.25s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="975" cy="150" r="3.5" fill="#eafff6"/>
</svg>
